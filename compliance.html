<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arete Care &middot; Compliance Portal</title>

<!-- The Compliance Portal is now the site root. This file stays behind so the
     bookmarks and links staff already have keep working. GitHub Pages has no
     server-side redirects, so it has to be done in the page itself.

     location.replace rather than assignment: it overwrites this entry in the
     history instead of adding one, so Back doesn't bounce the user straight
     back here. The meta refresh is the fallback if scripts are blocked. -->
<link rel="canonical" href="https://portal.aretecare.com.au/">
<meta http-equiv="refresh" content="0; url=./">

<link rel="icon" href="assets/arete-logo.png">
<style>
    body{ font-family:system-ui, sans-serif; margin:60px auto; max-width:520px; padding:0 20px; color:#2c2740; }
    a{ color:#3a9ca3; }
</style>
</head>

<body>

<p>The Compliance Portal has moved to <a href="./">portal.aretecare.com.au</a>. Taking you there now.</p>

<script>location.replace("./" + location.search + location.hash);</script>

</body>
</html>
